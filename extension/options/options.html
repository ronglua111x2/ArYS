<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArYS</title>
    <script src="../ui/theme.js"></script>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="../icons/icon-48.png" alt="" width="36" height="36" />
          <div>
            <strong data-i18n="app.name">ArYS</strong>
            <small class="muted" data-i18n="app.slogan"></small>
          </div>
        </div>
        <nav aria-label="Sections" data-i18n-aria-label="nav.label">
          <button type="button" class="nav-item active" data-view="blocked">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M5.6 5.6l12.8 12.8" />
            </svg>
            <span data-i18n="nav.blocked">Blocked sites</span>
          </button>
          <button type="button" class="nav-item" data-view="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
              <circle cx="16" cy="7" r="2" />
              <circle cx="10" cy="17" r="2" />
            </svg>
            <span data-i18n="nav.settings">Settings</span>
          </button>
          <button type="button" class="nav-item" data-view="about">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8v.01" />
            </svg>
            <span data-i18n="nav.about">About</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button
            type="button"
            id="theme-toggle"
            class="ghost"
            data-i18n-title="theme.label"
          ></button>
          <span id="version" class="muted small"></span>
        </div>
      </aside>

      <main>
        <!-- Blocked sites: always the first view -->
        <section id="view-blocked" class="view">
          <header class="view-header">
            <div>
              <div class="title-row">
                <h1 data-i18n="blocked.title">Blocked sites</h1>
                <span id="nuclear-chip" class="chip" hidden></span>
              </div>
              <p class="muted small" data-i18n="blocked.subtitle"></p>
            </div>
            <div class="actions">
              <button type="button" id="import" data-i18n="blocked.import">Import</button>
              <button type="button" id="export" data-i18n="blocked.export">Export</button>
              <button type="button" id="open-add" class="primary" data-i18n="blocked.add">
                + Add
              </button>
            </div>
          </header>

          <!-- The entries stay hidden until asked for, every time the page opens. -->
          <div class="list-head">
            <span id="count" class="muted small"></span>
            <button
              type="button"
              id="toggle-list"
              class="ghost"
              aria-expanded="false"
              aria-controls="entries"
              hidden
            ></button>
          </div>

          <div id="entries" hidden>
            <div class="toolbar">
              <input
                id="search"
                type="search"
                autocomplete="off"
                data-i18n-placeholder="blocked.search"
              />
              <div class="filters" role="group">
                <button type="button" class="filter active" data-kind="all" data-i18n="filter.all">
                  All
                </button>
                <button type="button" class="filter" data-kind="site" data-i18n="filter.site">
                  Sites
                </button>
                <button type="button" class="filter" data-kind="pattern" data-i18n="filter.pattern">
                  Patterns
                </button>
                <button type="button" class="filter" data-kind="system" data-i18n="filter.system">
                  Browser pages
                </button>
              </div>
            </div>
            <ul id="list" class="list card"></ul>
          </div>
          <p id="empty" class="empty muted" hidden></p>
          <input
            id="import-file"
            type="file"
            accept=".txt,.json,text/plain,application/json"
            hidden
          />
        </section>

        <!-- Settings -->
        <section id="view-settings" class="view" hidden>
          <header class="view-header">
            <h1 data-i18n="settings.title">Settings</h1>
            <span id="saved" class="saved small" hidden data-i18n="toast.saved">Saved</span>
          </header>

          <div class="card setting">
            <label for="language" class="setting-title" data-i18n="settings.language">
              Language
            </label>
            <select id="language">
              <option value="auto" data-i18n="settings.languageAuto">Same as browser</option>
              <option value="en">English</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </div>

          <!-- Block page -->
          <div class="card setting">
            <span class="setting-title" data-i18n="settings.blockPage">When a site is blocked</span>
            <label class="check">
              <input type="radio" name="block-page" value="default" />
              <span data-i18n="settings.blockPageDefault">Show the ArYS block page</span>
            </label>
            <label class="check">
              <input type="radio" name="block-page" value="url" />
              <span data-i18n="settings.blockPageUrl">Go to my own page</span>
            </label>
            <input
              id="block-page-url"
              type="url"
              inputmode="url"
              autocomplete="off"
              data-i18n-placeholder="settings.blockPageUrlPlaceholder"
            />
            <p
              id="block-page-url-error"
              class="error small"
              hidden
              data-i18n="settings.blockPageUrlInvalid"
            ></p>
            <p
              id="block-page-url-blocked"
              class="warn small"
              hidden
              data-i18n="settings.blockPageUrlBlocked"
            ></p>

            <div id="block-custom" class="block-custom">
              <div class="fields">
                <label class="check">
                  <input type="checkbox" id="show-title" />
                  <span data-i18n="settings.showTitle">Show a title</span>
                </label>
                <input
                  id="block-title"
                  type="text"
                  maxlength="60"
                  data-i18n-aria-label="settings.blockTitle"
                  data-i18n-placeholder="settings.blockTitlePlaceholder"
                />

                <label class="check">
                  <input type="checkbox" id="show-message" />
                  <span data-i18n="settings.showMessage">Show a message</span>
                </label>
                <textarea
                  id="block-message"
                  rows="3"
                  maxlength="280"
                  data-i18n-aria-label="settings.message"
                  data-i18n-placeholder="settings.messagePlaceholder"
                ></textarea>
                <span id="message-counter" class="muted small counter"></span>

                <button
                  type="button"
                  id="reset-block"
                  class="ghost reset"
                  data-i18n="settings.resetBlockPage"
                >
                  Reset to default
                </button>
              </div>

              <div class="preview-wrap">
                <span class="field-label" data-i18n="settings.preview">Preview</span>
                <div id="block-preview" class="block-preview">
                  <img src="../icons/icon-128.png" alt="" width="56" height="56" />
                  <strong id="pv-title"></strong>
                  <p id="pv-message"></p>
                </div>
              </div>
            </div>
          </div>

          <!-- Nuclear -->
          <div class="card setting" id="nuclear-card">
            <span class="setting-title" data-i18n="settings.nuclear">Nuclear option</span>
            <p class="muted small" data-i18n="settings.nuclearDesc"></p>

            <div id="nuclear-form" class="nuclear-form">
              <div class="inline">
                <label for="nuclear-amount" data-i18n="nuclear.duration">Duration</label>
                <input id="nuclear-amount" type="number" min="1" step="any" value="1" />
                <select id="nuclear-unit">
                  <option value="minutes" data-i18n="nuclear.minutes">minutes</option>
                  <option value="hours" selected data-i18n="nuclear.hours">hours</option>
                  <option value="days" data-i18n="nuclear.days">days</option>
                </select>
              </div>
              <div class="inline">
                <span data-i18n="nuclear.start">Start</span>
                <label class="check">
                  <input type="radio" name="nuclear-start" value="now" checked />
                  <span data-i18n="nuclear.startNow">Now</span>
                </label>
                <label class="check">
                  <input type="radio" name="nuclear-start" value="at" />
                  <span data-i18n="nuclear.startAt">At</span>
                </label>
                <input id="nuclear-at" type="datetime-local" disabled />
              </div>
              <p id="nuclear-error" class="error small" hidden></p>
              <div>
                <button
                  type="button"
                  id="nuclear-start"
                  class="primary"
                  data-i18n="nuclear.startButton"
                >
                  Start Nuclear
                </button>
              </div>
            </div>

            <div id="nuclear-status" class="nuclear-status" hidden>
              <span class="lock" aria-hidden="true">🔒</span>
              <strong id="nuclear-countdown" class="countdown"></strong>
              <span id="nuclear-until" class="muted small"></span>
            </div>
          </div>
        </section>

        <!-- About -->
        <section id="view-about" class="view" hidden>
          <header class="view-header">
            <h1 data-i18n="about.title">About</h1>
          </header>
          <div class="card about">
            <img src="../icons/icon-128.png" alt="" width="72" height="72" />
            <h2 data-i18n="app.name">ArYS</h2>
            <p class="slogan" data-i18n="app.slogan"></p>
            <p id="about-version" class="muted small"></p>
            <p data-i18n="about.description"></p>
            <div class="links">
              <a
                class="button"
                href="https://github.com/ronglua111x2/ArYS"
                target="_blank"
                rel="noopener"
                data-i18n="about.source"
                >Source code</a
              >
              <a
                class="button"
                href="https://github.com/ronglua111x2/ArYS/blob/publish/LICENSE"
                target="_blank"
                rel="noopener"
                data-i18n="about.license"
                >License (MIT)</a
              >
              <a class="button" href="../legal/legal.html?doc=privacy" data-i18n="about.privacy"
                >Privacy policy</a
              >
              <a class="button" href="../legal/legal.html?doc=terms" data-i18n="about.terms"
                >Terms of use</a
              >
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="add-dialog">
      <form id="add-form" method="dialog">
        <h2 id="add-title" data-i18n="add.title">Add to blocklist</h2>
        <textarea
          id="add-input"
          rows="8"
          spellcheck="false"
          data-i18n-placeholder="add.placeholder"
        ></textarea>
        <p class="help muted small" data-i18n="add.help"></p>
        <p id="summary" class="summary" aria-live="polite"></p>
        <ul id="preview" class="preview"></ul>
        <div id="add-warnings" class="warnings small" hidden></div>
        <p id="add-locked" class="warn small" hidden data-i18n="add.lockedNote"></p>
        <div class="dialog-actions">
          <button type="button" id="cancel" class="ghost" data-i18n="common.cancel">Cancel</button>
          <button type="submit" id="add" class="primary" disabled data-i18n="add.submitEmpty">
            Add
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="nuclear-dialog">
      <form id="nuclear-confirm-form" method="dialog">
        <h2 data-i18n="nuclear.confirmTitle">Start Nuclear?</h2>
        <p id="nuclear-confirm-from"></p>
        <p id="nuclear-confirm-until"></p>
        <div class="dialog-actions">
          <button type="button" id="nuclear-cancel" class="ghost" data-i18n="common.cancel">
            Cancel
          </button>
          <button type="submit" class="primary" data-i18n="nuclear.confirm">Start</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
