name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ArYS version (Options → About) and Edge version (edge://version)
      placeholder: ArYS 0.3.0, Edge 155.0.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please use example domains (site.test) instead of your real blocklist.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
